    body.fullscreen-mode .mobile-tabs { display: none !important; }

    main.sidebar { padding: 12px; max-width: 580px; margin: 0 auto; width: 100%; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

      position: relative; box-shadow: var(--shadow-sm);
    }
    .panel::before {
      content: attr(data-tag); position: absolute; top: -8px; left: 12px;
      background: var(--panel); padding: 0 6px; font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; font-weight: 500; }
    label:first-child { margin-top: 2px; }

    input[type="number"], input[type="text"], select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      color: var(--text); padding: 8px 10px; border-radius: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; outline: none; min-height: 36px;
    }

    input[type="color"] { width: 100%; height: 38px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 5px; cursor: pointer; padding: 2px; }

    .row { display: flex; gap: 8px; }

    .toggle { display: flex; gap: 4px; margin-top: 4px; }
    .toggle button {
      flex: 1; background: var(--toggle-bg); border: 1px solid var(--toggle-border);
      color: var(--muted); padding: 9px 6px; border-radius: 5px; cursor: pointer; font-size: 12px;
      transition: 0.15s; min-height: 38px;

    .toggle button.active { border-color: var(--accent); color: var(--accent); background: var(--toggle-active-bg); font-weight: 600; }

    .btn {
      background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text);

    }
    .btn.cyan { border-color: var(--accent); color: var(--accent); }

    .btn.full { width: 100%; margin-top: 6px; padding: 10px; font-size: 12px; min-height: 40px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .cta {
      width: 100%; background: var(--cta-bg); color: var(--cta-color); border: none; padding: 12px;
      border-radius: 7px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s;

    }
    .cta.secondary { background: var(--cta-secondary-bg); color: var(--cta-secondary-color); border: 1px solid var(--cta-secondary-border); box-shadow: none; }

    #stage-wrapper {
      overflow: auto; padding: 20px; background: var(--stage-bg); border: none;
      display: flex; justify-content: center; align-items: flex-start; min-height: 450px;
    }

    #stage {
      display: flex; flex-direction: column; align-items: center;
      transform-origin: top center; transition: transform 0.15s ease-out; position: relative;
    }

    .page {
      position: relative; background: #fff; box-shadow: var(--page-shadow);
      margin-bottom: 18px; touch-action: none; overflow: hidden;
    }
    .page.grid-bg {
      background-image: linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    }

    .el {
      position: absolute; box-sizing: border-box; cursor: grab; user-select: none; touch-action: none; overflow: visible;
    }
    .el.dragging { cursor: grabbing; }
    .el-content { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .el.show-overflow .el-content { overflow: visible; }
    .el img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; transform-origin: center center; }
    .el.show-overflow img { opacity: 0.85; }
    .el.selected { outline: var(--el-outline); outline-offset: 2px; }
    body.multiselect-mode .el.selected { outline: var(--el-outline-multi); }

    .handle {
      position: absolute; right: -9px; bottom: -9px; width: 24px; height: 24px;
      background: var(--handle-bg); border: 2px solid var(--handle-border); border-radius: 50%;
      cursor: se-resize; display: none; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .el.selected .handle { display: block; }

    .inspector {
      position: fixed; background: var(--inspector-bg); z-index: 50; display: none;

    .inspector-body { padding: 12px 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
    .inspector-dragbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 14px; background: var(--panel2); border-bottom: 1px solid var(--line);
      flex-shrink: 0; touch-action: none; cursor: grab; min-height: 40px;
    }
    .inspector-dragbar:active { cursor: grabbing; }
    .inspector-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
    .inspector-postabs { display: flex; gap: 4px; }
    .inspector-postabs button {
      background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
      width: 30px; height: 30px; border-radius: 5px; font-size: 14px; cursor: pointer;
    }
    .inspector-postabs button.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,196,0.1); }
    .inspector.pos-bottom { left: 0; right: 0; bottom: 0; border-top: 1px solid var(--accent); max-height: 80vh; }

    .checkline { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 32px; }
    .checkline input { accent-color: var(--accent); width: 16px; height: 16px; }

    .modal {
      position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(4px);
      z-index: 100; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 14px;
    }
    .modal.show { display: flex; }
    .modalbox {
      background: var(--modalbox-bg); border: 1px solid var(--modalbox-border); border-radius: 14px;
      padding: 20px; max-width: 480px; width: 100%; margin-top: auto; margin-bottom: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .modalbox h2 { margin: 0 0 8px; font-size: 17px; color: var(--text); }
    .closebtn { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 2px 8px; line-height: 1; min-height: 32px; }

    .adjust-box { background: var(--adjust-box-bg); border: 1px solid var(--adjust-box-border); padding: 10px; border-radius: 7px; margin-top: 8px; }
    .adjust-box label { margin-top: 2px; }
    .adjust-box input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 24px; }

    #printArea { display: none; }

    .theme-toggle-btn {
      background: none; border: 1px solid var(--line); color: var(--text); cursor: pointer;
      font-size: 16px; padding: 4px 8px; border-radius: 5px; margin-left: auto; min-height: 32px; min-width: 36px; flex-shrink: 0;
    }

    .theme-modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      z-index: 200; display: none; flex-direction: column; gap: 6px; min-width: 240px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .theme-modal.show { display: flex; }
    .theme-option {
      background: var(--panel2); border: 1px solid var(--line); color: var(--text);
      padding: 10px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; text-align: left;
      min-height: 40px; transition: 0.15s;
    }
    .theme-option:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .theme-backdrop { position: fixed; inset: 0; z-index: 150; display: none; }
    .theme-backdrop.show { display: block; }

    /* Guías de alineación */
    .guide-line {
      position: absolute; background-color: var(--guide-color); pointer-events: none; z-index: 999; opacity: 0.8;
    }
    .guide-line.horizontal { left: 0; right: 0; height: 1px; }
    .guide-line.vertical { top: 0; bottom: 0; width: 1px; }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block !important; position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; }
      #printArea .print-page { page-break-after: always; margin: 0; padding: 0; }

      #printArea img { display: block; width: 100%; height: auto; }
    }
  </style>
</head>

          <div class="row">
            <div style="flex: 0.5"><input type="color" id="borderColor" value="#000000" /></div>
            <div>
              <select id="borderWidth">
                <option value="0">Sin borde</option>
                <option value="1">1.0 mm</option>
                <option value="2">2.0 mm</option>
              </select>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top: 8px">
          <button class="btn" id="duplicateEl">Duplicar</button>
          <button class="btn" id="deleteEl" style="color: var(--danger); border-color: var(--danger)">Eliminar</button>
        </div>
      </div>

      <div id="multiInspectorControls" style="display: none"></div>
    </div>
  </div>

  <div class="modal" id="batchModal">
    <div class="modalbox">
      <button class="closebtn" id="closeBatch">✕</button>
      <h2>Organización Automática</h2>
      <label>1. Selecciona las imágenes</label>
      <input type="file" id="batchFiles" accept="image/*" multiple />
      <label>2. Tipo de Distribución</label>
      <div class="toggle">
        <button id="distribAuto" class="active">Auto (cantidad)</button>
        <button id="distribManual">Manual (cm)</button>
      </div>
      <div id="autoSection" style="margin-top: 8px">
        <label for="imgPerPage">Imágenes por Hoja</label>
        <input type="number" id="imgPerPage" value="4" min="1" step="1" />
      </div>
      <div id="manualSection" class="row" style="display: none; margin-top: 8px">
        <div>
          <label>Ancho (cm)</label>
          <input type="number" id="batchW" value="8" step="0.1" />
        </div>
        <div>
          <label>Alto (cm)</label>
          <input type="number" id="batchH" value="8" step="0.1" />
        </div>
      </div>
      <label>3. Modo de Ajuste</label>
      <div class="toggle">
        <button id="batchModeFit">Ajustar</button>
        <button id="batchModeFill" class="active">Rellenar</button>
      </div>
      <div class="row" style="margin-top: 8px">
        <div>
          <label>Separación (cm)</label>
          <input type="number" id="batchGap" value="0.5" step="0.1" min="0" />
        </div>
        <div>
          <label>Margen Hoja (cm)</label>
          <input type="number" id="batchMargin" value="1.0" step="0.1" min="0" />
        </div>
      </div>
      <label>4. Centrar Grupo en la Hoja</label>
      <select id="batchCenterMode">
        <option value="none" selected>Sin centrar</option>
        <option value="h">Centrar Horizontal</option>
        <option value="v">Centrar Vertical</option>
        <option value="both">Centrar Horizontal y Vertical</option>
      </select>
      <button class="cta full" id="runBatchBtn" style="margin-top: 12px">Generar Cuadrícula</button>
    </div>
  </div>

  <div id="printArea"></div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);

      const PAPERS = {
        carta: [21.6, 27.9],
        oficio: [21.6, 34],
        legal: [21.6, 35.6],
      };

      let orientation = "vertical";
      let paperType = "carta";
      let customW = 21.6;
      let customH = 27.9;

      let pages = [{ id: 1, els: [] }];
      let currentPageIndex = 0;
      let selectedIds = new Set();
      let multiSelectMode = false;

      let elCounter = 1;
      let pageCounter = 1;

      let PX_PER_CM = 10;
      let zoomScale = 0.7;
      let batchDistrib = "auto";
      let batchMode = "fill";

      let undoStack = [];
      let redoStack = [];
      let isHistoryAction = false;
      let clipboard = [];

      const imgCache = new Map();
      function getLoadedImage(src) {
        return new Promise((resolve, reject) => {
          if (imgCache.has(src)) {
            const img = imgCache.get(src);
            if (img.complete && img.naturalWidth > 0) return resolve(img);
          }
          const img = new Image();
          img.onload = () => { imgCache.set(src, img); resolve(img); };
          img.onerror = reject;
          img.src = src;
        });
      }

      function sanitizeEl(el) {
        el.mode = el.mode || "fit";
        if (el.imgZoom === undefined || el.imgZoom === null) el.imgZoom = 100;
        if (el.imgPosX === undefined || el.imgPosX === null) el.imgPosX = 0;
        if (el.imgPosY === undefined || el.imgPosY === null) el.imgPosY = 0;
        if (el.imgRotate === undefined || el.imgRotate === null) el.imgRotate = 0;
        if (el.showOverflow === undefined || el.showOverflow === null) el.showOverflow = false;
        if (el.borderColor === undefined) el.borderColor = "#000000";
        if (el.borderWidth === undefined) el.borderWidth = "0";
      }

      function saveState() {
        if (isHistoryAction) return;
        const snapshot = JSON.stringify({ pages, currentPageIndex, orientation, paperType, customW, customH });
        if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapshot) return;
        undoStack.push(snapshot);
        if (undoStack.length > 30) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      }

      function undo() {
        if (undoStack.length <= 1) return;
        isHistoryAction = true;
        redoStack.push(undoStack.pop());
        const prev = JSON.parse(undoStack[undoStack.length - 1]);
        pages = prev.pages; currentPageIndex = Math.min(prev.currentPageIndex, pages.length - 1);
        orientation = prev.orientation; paperType = prev.paperType; customW = prev.customW; customH = prev.customH;
        selectedIds = new Set();
        syncUIWithState(); renderAll();
        isHistoryAction = false;
        updateHistoryButtons();
      }

      function redo() {
        if (redoStack.length === 0) return;
        isHistoryAction = true;
        const snapshotStr = redoStack.pop();
        undoStack.push(snapshotStr);
        const next = JSON.parse(snapshotStr);
        pages = next.pages; currentPageIndex = Math.min(next.currentPageIndex, pages.length - 1);
        orientation = next.orientation; paperType = next.paperType; customW = next.customW; customH = next.customH;
        selectedIds = new Set();
        syncUIWithState(); renderAll();
        isHistoryAction = false;
        updateHistoryButtons();
      }

      function updateHistoryButtons() {
        $("undoBtn").disabled = undoStack.length <= 1;
        $("redoBtn").disabled = redoStack.length === 0;
      }

      function syncUIWithState() {
        $("paperType").value = paperType;
        $("customPaperRow").style.display = paperType === "custom" ? "flex" : "none";
        $("orientV").classList.toggle("active", orientation === "vertical");
        $("orientH").classList.toggle("active", orientation === "horizontal");
      }

      function getPaperCm() {
        let w, h;
        if (paperType === "custom") { w = customW; h = customH; }
        else { [w, h] = PAPERS[paperType]; }
        if (orientation === "horizontal") [w, h] = [h, w];
        return { w, h };
      }

      function recomputeScale() {
        const paper = getPaperCm();
        const wrapper = $("stage-wrapper");
        const availableWidth = wrapper ? wrapper.clientWidth - 40 : 480;
        const maxW = Math.max(260, Math.min(availableWidth, 520));
        PX_PER_CM = maxW / paper.w;
      }

      function findEl(id) { for (const p of pages) for (const e of p.els) if (e.id === id) return e; return null; }
      function currentPage() { return pages[currentPageIndex]; }
      function snap(val) { if (!$("snapGrid").checked) return val; const step = parseFloat($("snapStep").value) || 0.5; return Math.round(val / step) * step; }
      function isSelected(id) { return selectedIds.has(id); }
      function getSelectedEls() { return [...selectedIds].map(findEl).filter(Boolean); }
      function getSingleSelected() { return selectedIds.size === 1 ? findEl([...selectedIds][0]) : null; }
      function selectSingle(id) { selectedIds = new Set([id]); renderAll(); }
      function toggleSelect(id) { const next = new Set(selectedIds); next.has(id) ? next.delete(id) : next.add(id); selectedIds = next; renderAll(); }
      function deselectAll() { selectedIds = new Set(); $("inspector").classList.remove("show"); clearGuides(); renderAll(); }

      function centerElementsGroup(elements, paperDims, axis) {
        if (!elements || elements.length === 0) return;
        const minX = Math.min(...elements.map((e) => e.xCm));
        const maxX = Math.max(...elements.map((e) => e.xCm + e.wCm));
        const minY = Math.min(...elements.map((e) => e.yCm));
        const maxY = Math.max(...elements.map((e) => e.yCm + e.hCm));
        const groupW = maxX - minX, groupH = maxY - minY;
        let dx = 0, dy = 0;
        if (axis === "h" || axis === "both") dx = (paperDims.w - groupW) / 2 - minX;
        if (axis === "v" || axis === "both") dy = (paperDims.h - groupH) / 2 - minY;
        elements.forEach((e) => { e.xCm = snap(e.xCm + dx); e.yCm = snap(e.yCm + dy); });
      }

      function clearGuides() {
        const stage = $("stage");
        if (!stage) return;
        const existing = stage.querySelectorAll(".guide-line");
        existing.forEach(line => line.remove());
      }

      function showGuides(guidePositionsX, guidePositionsY) {
        clearGuides();
        const stage = $("stage");
        if (!stage) return;
        guidePositionsX.forEach(posX => {
          const line = document.createElement("div");
          line.className = "guide-line vertical";
          line.style.left = (posX * PX_PER_CM) + "px";
          stage.appendChild(line);
        });
        guidePositionsY.forEach(posY => {
          const line = document.createElement("div");
          line.className = "guide-line horizontal";
          line.style.top = (posY * PX_PER_CM) + "px";
          stage.appendChild(line);
        });
      }

      function computeAlignmentSnap(rawX, rawY, draggedEl, allEls, thresholdPx) {
        const thresholdCm = thresholdPx / (PX_PER_CM * zoomScale);
        const w = draggedEl.wCm;
        const h = draggedEl.hCm;
        const draggedPointsX = {
          left: rawX,
          right: rawX + w,
          centerX: rawX + w / 2
        };
        const draggedPointsY = {
          top: rawY,
          bottom: rawY + h,
          centerY: rawY + h / 2
        };

        const candidatesX = [];
        const candidatesY = [];

        allEls.forEach(el => {
          if (el.id === draggedEl.id) return;
          candidatesX.push({ value: el.xCm, source: 'left' });
          candidatesX.push({ value: el.xCm + el.wCm, source: 'right' });
          candidatesX.push({ value: el.xCm + el.wCm / 2, source: 'centerX' });
          candidatesY.push({ value: el.yCm, source: 'top' });
          candidatesY.push({ value: el.yCm + el.hCm, source: 'bottom' });
          candidatesY.push({ value: el.yCm + el.hCm / 2, source: 'centerY' });
        });

        let bestOffsetX = null, bestOffsetY = null;
        let bestDistX = Infinity, bestDistY = Infinity;
        const guideLinesX = new Set();
        const guideLinesY = new Set();

        Object.keys(draggedPointsX).forEach(dragKey => {
          const dragVal = draggedPointsX[dragKey];
          candidatesX.forEach(cand => {
            const offset = cand.value - dragVal;
            const dist = Math.abs(offset);
            if (dist < thresholdCm && dist < bestDistX) {
              bestDistX = dist;
              bestOffsetX = offset;
              guideLinesX.clear();
              guideLinesX.add(cand.value);
            } else if (dist < thresholdCm && dist === bestDistX) {
              guideLinesX.add(cand.value);
            }
          });
        });

        Object.keys(draggedPointsY).forEach(dragKey => {
          const dragVal = draggedPointsY[dragKey];
          candidatesY.forEach(cand => {
            const offset = cand.value - dragVal;
            const dist = Math.abs(offset);
            if (dist < thresholdCm && dist < bestDistY) {
              bestDistY = dist;
              bestOffsetY = offset;
              guideLinesY.clear();
              guideLinesY.add(cand.value);
            } else if (dist < thresholdCm && dist === bestDistY) {
              guideLinesY.add(cand.value);
            }
          });
        });

        const snappedX = bestOffsetX !== null ? rawX + bestOffsetX : rawX;
        const snappedY = bestOffsetY !== null ? rawY + bestOffsetY : rawY;

        return {
          snappedX,
          snappedY,
          guideLinesX: Array.from(guideLinesX),
          guideLinesY: Array.from(guideLinesY)
        };
      }

      async function renderPageToCanvas(pageIndex, targetDpi = 300) {
        const paper = getPaperCm();
        const pxPerCm = targetDpi / 2.54;
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(paper.w * pxPerCm);
        canvas.height = Math.floor(paper.h * pxPerCm);
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const p = pages[pageIndex];
        if (!p) return canvas;
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        for (const el of p.els) {
          sanitizeEl(el);
          try {
            const img = await getLoadedImage(el.src);
            const xPx = el.xCm * pxPerCm, yPx = el.yCm * pxPerCm, wPx = el.wCm * pxPerCm, hPx = el.hCm * pxPerCm;
            if (wPx <= 0 || hPx <= 0) continue;
            ctx.save(); ctx.beginPath(); ctx.rect(xPx, yPx, wPx, hPx); ctx.clip();
            const zoom = (Number(el.imgZoom) || 100) / 100;
            const posX = Number(el.imgPosX) || 0, posY = Number(el.imgPosY) || 0;
            const rot = (Number(el.imgRotate) || 0) * (Math.PI / 180);
            const mode = el.mode || "fit";
            const imgAspect = img.width / img.height;
            const frameAspect = wPx / hPx;
            let drawW, drawH;
            if (mode === "fill") {
              if (imgAspect > frameAspect) { drawH = hPx; drawW = drawH * imgAspect; }
              else { drawW = wPx; drawH = drawW / imgAspect; }
              if (zoom < 1.0) { if (imgAspect > frameAspect) { drawW = wPx; drawH = drawW / imgAspect; } else { drawH = hPx; drawW = drawH * imgAspect; } }
              const objPosX = 50 + posX / 2, objPosY = 50 + posY / 2;
              const anchorImgX = (drawW * objPosX) / 100, anchorImgY = (drawH * objPosY) / 100;
              const anchorContainerX = (wPx * objPosX) / 100, anchorContainerY = (hPx * objPosY) / 100;
              let imgLeft = xPx + anchorContainerX - anchorImgX, imgTop = yPx + anchorContainerY - anchorImgY;
              const centerX = xPx + wPx / 2, centerY = yPx + hPx / 2;
              const imgCenterX = imgLeft + drawW / 2, imgCenterY = imgTop + drawH / 2;
              const newCenterX = centerX + (imgCenterX - centerX) * zoom, newCenterY = centerY + (imgCenterY - centerY) * zoom;
              const newW = drawW * zoom, newH = drawH * zoom;
              imgLeft = newCenterX - newW / 2; imgTop = newCenterY - newH / 2;
              ctx.translate(centerX, centerY); ctx.rotate(rot); ctx.translate(-centerX, -centerY);
              ctx.drawImage(img, imgLeft, imgTop, newW, newH);
            } else {
              if (imgAspect > frameAspect) { drawW = wPx; drawH = drawW / imgAspect; }
              else { drawH = hPx; drawW = drawH * imgAspect; }
              const overflowX = wPx - drawW, overflowY = hPx - drawH;
              const offsetX = (overflowX / 2) * (posX / 100), offsetY = (overflowY / 2) * (posY / 100);
              const centerX = xPx + wPx / 2, centerY = yPx + hPx / 2;
              let imgCenterX = centerX + offsetX, imgCenterY = centerY + offsetY;
              const newW = drawW * zoom, newH = drawH * zoom;
              const newCenterX = centerX + (imgCenterX - centerX) * zoom, newCenterY = centerY + (imgCenterY - centerY) * zoom;
              const imgLeft = newCenterX - newW / 2, imgTop = newCenterY - newH / 2;
              ctx.translate(centerX, centerY); ctx.rotate(rot); ctx.translate(-centerX, -centerY);
              ctx.drawImage(img, imgLeft, imgTop, newW, newH);
            }
            ctx.restore();
            if (el.borderWidth && parseFloat(el.borderWidth) > 0) {
              const borderPx = (parseFloat(el.borderWidth) / 10) * pxPerCm;
              ctx.save(); ctx.strokeStyle = el.borderColor || "#000000"; ctx.lineWidth = borderPx;
              const half = borderPx / 2; ctx.strokeRect(xPx + half, yPx + half, wPx - borderPx, hPx - borderPx);
              ctx.restore();
            }
          } catch (err) { console.error("Error renderizando imagen:", err); }
        }
        return canvas;
      }

      function setZoom(val) { zoomScale = Math.max(0.2, Math.min(2.0, val)); $("quickZoomVal").textContent = Math.round(zoomScale * 100) + "%"; renderAll(); }

      function renderAll() {
        recomputeScale();
        const paper = getPaperCm();
        const stage = $("stage"); stage.innerHTML = "";
        const p = currentPage();
        stage.style.transform = `scale(${zoomScale})`;
        const pageDiv = document.createElement("div");
        pageDiv.className = "page" + ($("showGrid").checked ? " grid-bg" : "");
        pageDiv.style.width = paper.w * PX_PER_CM + "px";
        pageDiv.style.height = paper.h * PX_PER_CM + "px";
        const stepCm = parseFloat($("snapStep").value) || 0.5;
        if ($("showGrid").checked) pageDiv.style.backgroundSize = `${stepCm * PX_PER_CM}px ${stepCm * PX_PER_CM}px`;
        pageDiv.addEventListener("pointerdown", (e) => { if (e.target === pageDiv) deselectAll(); });
        p.els.forEach((el) => {
          sanitizeEl(el);
          const d = document.createElement("div");
          d.className = "el" + (isSelected(el.id) ? " selected" : "") + (el.showOverflow ? " show-overflow" : "");
          d.dataset.id = el.id;
          d.style.left = el.xCm * PX_PER_CM + "px"; d.style.top = el.yCm * PX_PER_CM + "px";
          d.style.width = el.wCm * PX_PER_CM + "px"; d.style.height = el.hCm * PX_PER_CM + "px";
          const contentDiv = document.createElement("div"); contentDiv.className = "el-content";
          if (el.borderWidth && parseFloat(el.borderWidth) > 0) {
            const borderPx = (parseFloat(el.borderWidth) / 10) * PX_PER_CM;
            d.style.border = `${Math.max(1, borderPx)}px solid ${el.borderColor || "#000000"}`;
          } else d.style.border = "none";
          const img = document.createElement("img"); img.src = el.src;
          img.style.objectFit = el.mode === "fill" ? "cover" : "contain";
          const zoom = (el.imgZoom !== undefined ? el.imgZoom : 100) / 100;
          const posX = el.imgPosX || 0, posY = el.imgPosY || 0, rot = el.imgRotate || 0;
          if (el.mode === "fill") {
            img.style.objectPosition = `${50 + posX / 2}% ${50 + posY / 2}%`;
            img.style.transform = `scale(${zoom}) rotate(${rot}deg)`;
            if (zoom < 1.0) img.style.objectFit = "contain";
          } else { img.style.transform = `translate(${posX}%, ${posY}%) scale(${zoom}) rotate(${rot}deg)`; }
          contentDiv.appendChild(img); d.appendChild(contentDiv);
          if (selectedIds.size <= 1) { const handle = document.createElement("div"); handle.className = "handle"; d.appendChild(handle); attachResize(handle, d, el); }
          attachDrag(d, el);
          d.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); if (multiSelectMode) toggleSelect(el.id); else if (!isSelected(el.id)) selectSingle(el.id); });
          pageDiv.appendChild(d);
        });
        stage.appendChild(pageDiv);
        $("quickPageLabel").textContent = `${currentPageIndex + 1}/${pages.length}`;
        $("prevPageQuickBtn").disabled = currentPageIndex === 0;
        $("nextPageQuickBtn").disabled = currentPageIndex === pages.length - 1;
        syncInspector();
        clearGuides();
      }

      function attachDrag(d, el) {
        let dragging = false, sx = 0, sy = 0, startPositions = new Map();
        d.addEventListener("pointerdown", (e) => {
          if (e.target.classList.contains("handle")) return;
          dragging = true;
          d.classList.add("dragging");
          sx = e.clientX;
          sy = e.clientY;
          const group = isSelected(el.id) && selectedIds.size > 1 ? getSelectedEls() : [el];
          startPositions = new Map(group.map((e2) => [e2.id, { xCm: e2.xCm, yCm: e2.yCm }]));
          d.setPointerCapture(e.pointerId);
        });
        d.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dxCm = (e.clientX - sx) / (PX_PER_CM * zoomScale);
          const dyCm = (e.clientY - sy) / (PX_PER_CM * zoomScale);

          const group = isSelected(el.id) && selectedIds.size > 1 ? getSelectedEls() : [el];
          const firstEl = group[0] || el;
          const rawX = startPositions.get(firstEl.id).xCm + dxCm;
          const rawY = startPositions.get(firstEl.id).yCm + dyCm;

          let newX = rawX, newY = rawY;
          let showX = [], showY = [];

          if ($("alignGuides").checked) {
            const allEls = currentPage().els;
            const snapResult = computeAlignmentSnap(rawX, rawY, firstEl, allEls, 8);
            newX = snapResult.snappedX;
            newY = snapResult.snappedY;
            showX = snapResult.guideLinesX;
            showY = snapResult.guideLinesY;
            showGuides(showX, showY);
          } else {
            clearGuides();
          }

          if ($("snapGrid").checked) {
            newX = snap(newX);
            newY = snap(newY);
          }

          const deltaX = newX - startPositions.get(firstEl.id).xCm;
          const deltaY = newY - startPositions.get(firstEl.id).yCm;

          startPositions.forEach((pos, id) => {
            const e2 = findEl(id); if (!e2) return;
            e2.xCm = pos.xCm + deltaX;
            e2.yCm = pos.yCm + deltaY;
            const domEl = document.querySelector(`.el[data-id="${id}"]`);
            if (domEl) {
              domEl.style.left = e2.xCm * PX_PER_CM + "px";
              domEl.style.top = e2.yCm * PX_PER_CM + "px";
            }
          });
          syncInspectorInputsOnly();
        });
        const end = () => {
          if (dragging) {
            dragging = false;
            d.classList.remove("dragging");
            clearGuides();
            saveState();
            syncInspector();
          }
        };
        d.addEventListener("pointerup", end);
        d.addEventListener("pointercancel", end);
      }

      function attachResize(handle, d, el) {
        let resizing = false, sx = 0, sy = 0, swCm = 0, shCm = 0;
        handle.addEventListener("pointerdown", (e) => { e.stopPropagation(); resizing = true; sx = e.clientX; sy = e.clientY; swCm = el.wCm; shCm = el.hCm; handle.setPointerCapture(e.pointerId); });
        handle.addEventListener("pointermove", (e) => { if (!resizing) return; const dwCm = (e.clientX - sx) / (PX_PER_CM * zoomScale); const dhCm = (e.clientY - sy) / (PX_PER_CM * zoomScale); el.wCm = Math.max(0.5, snap(swCm + dwCm)); el.hCm = Math.max(0.5, snap(shCm + dhCm)); d.style.width = el.wCm * PX_PER_CM + "px"; d.style.height = el.hCm * PX_PER_CM + "px"; syncInspectorInputsOnly(); });
        const end = () => { if (resizing) { resizing = false; saveState(); } };
        handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
      }

      function syncInspectorInputsOnly() {
        const els = getSelectedEls();
        if (els.length === 0) return;
        const first = els[0];
        $("elW").value = first.wCm.toFixed(1);
        $("elH").value = first.hCm.toFixed(1);
      }

      function syncInspector() {
        const els = getSelectedEls();
        const count = els.length;
        if (count === 0) { $("inspector").classList.remove("show"); return; }
        $("inspector").classList.add("show");
        $("centerModeSelect").value = "none";
        $("singleInspectorControls").style.display = "block";
        $("multiInspectorControls").style.display = "none";

        const label = $("singleMultiLabel");
        const dupBtn = $("duplicateEl");
        const delBtn = $("deleteEl");
        if (count > 1) {
          label.style.display = "block";
          label.textContent = `${count} imágenes seleccionadas`;
          dupBtn.textContent = "Duplicar Todas";
          delBtn.textContent = "Eliminar Todas";
        } else {
          label.style.display = "none";
          dupBtn.textContent = "Duplicar";
          delBtn.textContent = "Eliminar";
        }

        const first = els[0];
        $("elW").value = first.wCm.toFixed(1);
        $("elH").value = first.hCm.toFixed(1);
        $("modeFit").classList.toggle("active", first.mode === "fit");
        $("modeFill").classList.toggle("active", first.mode === "fill");
        $("borderColor").value = first.borderColor || "#000000";
        $("borderWidth").value = first.borderWidth || "0";
        $("imgZoom").value = first.imgZoom !== undefined ? first.imgZoom : 100;
        $("imgZoomVal").textContent = (first.imgZoom !== undefined ? first.imgZoom : 100) + "%";
        $("imgPosX").value = first.imgPosX || 0;
        $("imgPosXVal").textContent = (first.imgPosX || 0) + "%";
        $("imgPosY").value = first.imgPosY || 0;
        $("imgPosYVal").textContent = (first.imgPosY || 0) + "%";
        $("imgRotate").value = first.imgRotate || 0;
        $("showOverflowCheck").checked = !!first.showOverflow;
      }

      function applyTheme(themeName) {
        document.body.className = document.body.className.replace(/theme-\w+/g, '');
        document.body.classList.add(`theme-${themeName}`);
        localStorage.setItem('image-editor-theme', themeName);
      }

      function loadTheme() {
        const saved = localStorage.getItem('image-editor-theme') || 'sunset';
        applyTheme(saved);
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadTheme();
        const themeBtn = $('themeToggleBtn');
        const themeModal = $('themeModal');
        const themeBackdrop = $('themeBackdrop');
        themeBtn.addEventListener('click', () => { themeModal.classList.toggle('show'); themeBackdrop.classList.toggle('show'); });
        themeBackdrop.addEventListener('click', () => { themeModal.classList.remove('show'); themeBackdrop.classList.remove('show'); });
        document.querySelectorAll('.theme-option').forEach(btn => {
          btn.addEventListener('click', (e) => { const theme = e.target.dataset.theme; applyTheme(theme); themeModal.classList.remove('show'); themeBackdrop.classList.remove('show'); });
        });
      });

      window.addEventListener("load", () => {
        saveState();
        window.addEventListener("resize", renderAll);
        $("multiSelectBtn").addEventListener("click", () => { multiSelectMode = !multiSelectMode; $("multiSelectBtn").classList.toggle("cyan", multiSelectMode); $("multiSelectBtn").textContent = multiSelectMode ? "☰ Multi: ON" : "☰ Multi"; document.body.classList.toggle("multiselect-mode", multiSelectMode); renderAll(); });
        $("zoomInQuickBtn").addEventListener("click", () => setZoom(zoomScale + 0.15));
        $("zoomOutQuickBtn").addEventListener("click", () => setZoom(zoomScale - 0.15));
        $("zoomResetQuickBtn").addEventListener("click", () => setZoom(1.0));
        $("copyBtn").addEventListener("click", () => { const els = getSelectedEls(); if (els.length > 0) clipboard = els.map((el) => JSON.parse(JSON.stringify(el))); });
        $("cutBtn").addEventListener("click", () => { const els = getSelectedEls(); if (els.length > 0) { clipboard = els.map((el) => JSON.parse(JSON.stringify(el))); const p = currentPage(); p.els = p.els.filter((e) => !selectedIds.has(e.id)); saveState(); deselectAll(); } });
        $("pasteBtn").addEventListener("click", () => { if (clipboard && clipboard.length > 0) { const p = currentPage(); const newIds = []; clipboard.forEach((el) => { const newEl = JSON.parse(JSON.stringify(el)); newEl.id = ++elCounter; newEl.xCm += 0.5; newEl.yCm += 0.5; p.els.push(newEl); newIds.push(newEl.id); }); selectedIds = new Set(newIds); saveState(); renderAll(); } });
        $("prevPageQuickBtn").addEventListener("click", () => { if (currentPageIndex > 0) { currentPageIndex--; deselectAll(); } });
        $("nextPageQuickBtn").addEventListener("click", () => { if (currentPageIndex < pages.length - 1) { currentPageIndex++; deselectAll(); } });
        $("toggleViewModeBtn").addEventListener("click", () => { document.body.classList.toggle("fullscreen-mode"); const isFull = document.body.classList.contains("fullscreen-mode"); $("toggleViewModeBtn").textContent = isFull ? "📋 Ver Controles" : "🖼️ Solo Hoja"; renderAll(); });
        document.querySelectorAll(".mobile-tabs button").forEach((btn) => { btn.addEventListener("click", () => { document.querySelectorAll(".mobile-tabs button").forEach((b) => b.classList.remove("active")); btn.classList.add("active"); document.body.classList.remove("fullscreen-mode"); $("toggleViewModeBtn").textContent = "🖼️ Solo Hoja"; renderAll(); }); });
        $("undoBtn").addEventListener("click", undo); $("redoBtn").addEventListener("click", redo);
        $("paperType").addEventListener("change", (e) => { paperType = e.target.value; $("customPaperRow").style.display = paperType === "custom" ? "flex" : "none"; saveState(); renderAll(); });
        $("paperW").addEventListener("change", (e) => { customW = parseFloat(e.target.value) || customW || 21.6; saveState(); renderAll(); });
        $("paperH").addEventListener("change", (e) => { customH = parseFloat(e.target.value) || customH || 27.9; saveState(); renderAll(); });
        $("orientV").addEventListener("click", () => { orientation = "vertical"; $("orientV").classList.add("active"); $("orientH").classList.remove("active"); saveState(); renderAll(); });
        $("orientH").addEventListener("click", () => { orientation = "horizontal"; $("orientH").classList.add("active"); $("orientV").classList.remove("active"); saveState(); renderAll(); });
        $("showGrid").addEventListener("change", renderAll); $("snapGrid").addEventListener("change", renderAll); $("snapStep").addEventListener("change", renderAll);
        $("openBatchBtn").addEventListener("click", () => $("batchModal").classList.add("show"));
        $("closeBatch").addEventListener("click", () => $("batchModal").classList.remove("show"));
        $("distribAuto").addEventListener("click", () => { batchDistrib = "auto"; $("distribAuto").classList.add("active"); $("distribManual").classList.remove("active"); $("autoSection").style.display = "block"; $("manualSection").style.display = "none"; });
        $("distribManual").addEventListener("click", () => { batchDistrib = "manual"; $("distribManual").classList.add("active"); $("distribAuto").classList.remove("active"); $("autoSection").style.display = "none"; $("manualSection").style.display = "flex"; });
        $("batchModeFit").addEventListener("click", () => { batchMode = "fit"; $("batchModeFit").classList.add("active"); $("batchModeFill").classList.remove("active"); });
        $("batchModeFill").addEventListener("click", () => { batchMode = "fill"; $("batchModeFill").classList.add("active"); $("batchModeFit").classList.remove("active"); });
        $("runBatchBtn").addEventListener("click", () => {
          const filesInput = $("batchFiles");
          if (!filesInput.files || filesInput.files.length === 0) { alert("Por favor selecciona al menos una imagen."); return; }
          const files = Array.from(filesInput.files);
          const paper = getPaperCm();
          const margin = parseFloat($("batchMargin").value) || 1.0;
          const gap = parseFloat($("batchGap").value) || 0.5;
          const centerMode = $("batchCenterMode").value;
          let cols = 1, rows = 1;
          let perPage = 4;
          if (batchDistrib === "auto") {
            const ipp = parseInt($("imgPerPage").value) || 4;
            perPage = ipp;
            if (ipp === 1) { cols = 1; rows = 1; }
            else if (ipp === 2) { cols = 1; rows = 2; }
            else if (ipp === 3) { cols = 1; rows = 3; }
            else if (ipp === 4) { cols = 2; rows = 2; }
            else { cols = Math.ceil(Math.sqrt(ipp)); rows = Math.ceil(ipp / cols); }
          } else { perPage = Infinity; }
          let cellW = 0, cellH = 0;
          if (batchDistrib === "auto") {
            cellW = (paper.w - margin * 2 - gap * (cols - 1)) / cols;
            cellH = (paper.h - margin * 2 - gap * (rows - 1)) / rows;
          } else {
            cellW = parseFloat($("batchW").value) || 8; cellH = parseFloat($("batchH").value) || 8;
            cols = Math.max(1, Math.floor((paper.w - margin * 2 + gap) / (cellW + gap)));
            rows = Math.max(1, Math.floor((paper.h - margin * 2 + gap) / (cellH + gap)));
            perPage = cols * rows;
          }
          let loadedCount = 0;
          const addedByPage = {};
          files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const pageIdx = Math.floor(index / perPage);
              const posInPage = index % perPage;
              while (pages.length <= pageIdx) pages.push({ id: ++pageCounter, els: [] });
              const col = posInPage % cols;
              const row = Math.floor(posInPage / cols);
              const xCm = margin + col * (cellW + gap);
              const yCm = margin + row * (cellH + gap);
              const newEl = {
                id: ++elCounter, src: ev.target.result,
                xCm: snap(xCm), yCm: snap(yCm),
                wCm: snap(cellW), hCm: snap(cellH),
                mode: batchMode, imgZoom: 100, imgPosX: 0, imgPosY: 0,
                imgRotate: 0, showOverflow: false
              };
              pages[pageIdx].els.push(newEl);
              if (!addedByPage[pageIdx]) addedByPage[pageIdx] = [];
              addedByPage[pageIdx].push(newEl);
              loadedCount++;
              if (loadedCount === files.length) {
                if (centerMode !== "none") Object.keys(addedByPage).forEach((pIdx) => centerElementsGroup(addedByPage[pIdx], paper, centerMode));
                $("batchModal").classList.remove("show");
                saveState(); renderAll();
              }
            };
            reader.readAsDataURL(file);
          });
        });

        const applyToAllSelected = (callback) => {
          const els = getSelectedEls();
          if (els.length === 0) return;
          els.forEach(callback);
        };

        $("imgZoom").addEventListener("input", (e) => { const val = parseInt(e.target.value); applyToAllSelected(el => { el.imgZoom = val; }); $("imgZoomVal").textContent = val + "%"; renderAll(); });
        $("imgZoom").addEventListener("change", saveState);
        $("imgPosX").addEventListener("input", (e) => { const val = parseInt(e.target.value); applyToAllSelected(el => { el.imgPosX = val; }); $("imgPosXVal").textContent = val + "%"; renderAll(); });
        $("imgPosX").addEventListener("change", saveState);
        $("imgPosY").addEventListener("input", (e) => { const val = parseInt(e.target.value); applyToAllSelected(el => { el.imgPosY = val; }); $("imgPosYVal").textContent = val + "%"; renderAll(); });
        $("imgPosY").addEventListener("change", saveState);
        $("imgRotate").addEventListener("change", (e) => { const val = parseInt(e.target.value); applyToAllSelected(el => { el.imgRotate = val; }); saveState(); renderAll(); });
        $("showOverflowCheck").addEventListener("change", (e) => { const checked = e.target.checked; applyToAllSelected(el => { el.showOverflow = checked; }); saveState(); renderAll(); });
        $("resetImgAdjust").addEventListener("click", () => { applyToAllSelected(el => { el.imgZoom = 100; el.imgPosX = 0; el.imgPosY = 0; el.imgRotate = 0; el.showOverflow = false; }); saveState(); syncInspector(); renderAll(); });
        $("elW").addEventListener("input", (e) => { const val = parseFloat(e.target.value); if (!isNaN(val) && val > 0) { applyToAllSelected(el => { el.wCm = val; const domEl = document.querySelector(`.el[data-id="${el.id}"]`); if (domEl) domEl.style.width = el.wCm * PX_PER_CM + "px"; }); } });
        $("elW").addEventListener("change", (e) => { applyToAllSelected(el => { el.wCm = Math.max(0.5, parseFloat(e.target.value) || el.wCm || 1); }); saveState(); renderAll(); });
        $("elH").addEventListener("input", (e) => { const val = parseFloat(e.target.value); if (!isNaN(val) && val > 0) { applyToAllSelected(el => { el.hCm = val; const domEl = document.querySelector(`.el[data-id="${el.id}"]`); if (domEl) domEl.style.height = el.hCm * PX_PER_CM + "px"; }); } });
        $("elH").addEventListener("change", (e) => { applyToAllSelected(el => { el.hCm = Math.max(0.5, parseFloat(e.target.value) || el.hCm || 1); }); saveState(); renderAll(); });
        $("modeFit").addEventListener("click", () => { applyToAllSelected(el => { el.mode = "fit"; }); $("modeFit").classList.add("active"); $("modeFill").classList.remove("active"); saveState(); renderAll(); });
        $("modeFill").addEventListener("click", () => { applyToAllSelected(el => { el.mode = "fill"; }); $("modeFill").classList.add("active"); $("modeFit").classList.remove("active"); saveState(); renderAll(); });
        $("borderColor").addEventListener("input", (e) => { applyToAllSelected(el => { el.borderColor = e.target.value; }); renderAll(); });
        $("borderColor").addEventListener("change", saveState);
        $("borderWidth").addEventListener("change", (e) => { applyToAllSelected(el => { el.borderWidth = e.target.value; }); saveState(); renderAll(); });
        $("duplicateEl").addEventListener("click", () => { const els = getSelectedEls(); if (els.length === 0) return; const newIds = []; els.forEach(el => { const newEl = JSON.parse(JSON.stringify(el)); newEl.id = ++elCounter; newEl.xCm += 0.5; newEl.yCm += 0.5; currentPage().els.push(newEl); newIds.push(newEl.id); }); selectedIds = new Set(newIds); saveState(); renderAll(); });
        $("deleteEl").addEventListener("click", () => { const p = currentPage(); p.els = p.els.filter(e => !selectedIds.has(e.id)); saveState(); deselectAll(); });
        $("applyCenterBtn").addEventListener("click", () => { const mode = $("centerModeSelect").value; if (mode === "none") return; const els = getSelectedEls(); if (els.length === 0) return; centerElementsGroup(els, getPaperCm(), mode); saveState(); renderAll(); });
        $("closeInspector").addEventListener("click", deselectAll);

        const inspectorEl = $("inspector"); const posButtons = { bottom: $("posBottomBtn") }; const inspectorSizes = { bottom: "250px" }; let inspectorPos = "bottom";
        function applyInspectorPosition(pos) { inspectorPos = pos; inspectorEl.classList.remove("pos-bottom"); inspectorEl.classList.add("pos-" + pos); inspectorEl.style.height = inspectorSizes["bottom"]; inspectorEl.style.width = ""; if (posButtons.bottom) posButtons.bottom.classList.add("active"); }
        const dragbar = $("inspectorDragbar"); let resizingInspector = false, startClientX = 0, startClientY = 0, startSize = 0;
        dragbar.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; resizingInspector = true; startClientX = e.clientX; startClientY = e.clientY; const rect = inspectorEl.getBoundingClientRect(); startSize = rect.height; dragbar.setPointerCapture(e.pointerId); });
        dragbar.addEventListener("pointermove", (e) => { if (!resizingInspector) return; let newSize = startSize - (e.clientY - startClientY); newSize = Math.max(120, Math.min(window.innerHeight * 0.85, newSize)); inspectorEl.style.height = newSize + "px"; inspectorSizes["bottom"] = newSize + "px"; });
        dragbar.addEventListener("pointerup", () => (resizingInspector = false)); dragbar.addEventListener("pointercancel", () => (resizingInspector = false));

        $("addFiles").addEventListener("change", (e) => { const files = Array.from(e.target.files); let count = 0; files.forEach((file) => { const reader = new FileReader(); reader.onload = (ev) => { currentPage().els.push({ id: ++elCounter, src: ev.target.result, xCm: 1.0, yCm: 1.0, wCm: 8.0, hCm: 8.0, mode: "fit", imgZoom: 100, imgPosX: 0, imgPosY: 0, imgRotate: 0, showOverflow: false }); count++; if (count === files.length) { saveState(); renderAll(); } }; reader.readAsDataURL(file); }); });
        $("addPageBtn").addEventListener("click", () => { pages.push({ id: ++pageCounter, els: [] }); currentPageIndex = pages.length - 1; saveState(); deselectAll(); });
        $("delPageBtn").addEventListener("click", () => { if (pages.length > 1) { pages.splice(currentPageIndex, 1); if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1; saveState(); deselectAll(); } });

        $("pdfBtn").addEventListener("click", async () => {
          saveState();
          const btn = $("pdfBtn"); btn.disabled = true; btn.textContent = "Generando PDF…";
          try {
            const { jsPDF } = window.jspdf;
            const paper = getPaperCm();
            const pdf = new jsPDF({ unit: "cm", format: [paper.w, paper.h], orientation: "portrait", compress: true });
            for (let i = 0; i < pages.length; i++) {
              const canvas = await renderPageToCanvas(i, 300);
              const imgData = canvas.toDataURL("image/jpeg", 0.95);
              if (i > 0) pdf.addPage([paper.w, paper.h], "portrait");
              pdf.addImage(imgData, "JPEG", 0, 0, paper.w, paper.h, undefined, "FAST");
            }
            pdf.save("Documento_Impresion.pdf");
          } catch (err) { console.error(err); alert("Ocurrió un error al generar el PDF."); }
          finally { btn.disabled = false; btn.textContent = "Generar PDF"; }
        });

        $("printBtn").addEventListener("click", async () => {
          saveState();
          const btn = $("printBtn"); btn.disabled = true; btn.textContent = "Preparando…";
          try {
            const paper = getPaperCm();
            const printArea = $("printArea");
            printArea.innerHTML = "";
            let styleTag = document.getElementById("dynamicPageSize");
            if (!styleTag) { styleTag = document.createElement("style"); styleTag.id = "dynamicPageSize"; document.head.appendChild(styleTag); }
            styleTag.textContent = `@media print { @page { size: ${paper.w}cm ${paper.h}cm; margin: 0; } }`;
            for (let i = 0; i < pages.length; i++) {
              const canvas = await renderPageToCanvas(i, 300);
              const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
              const pageDiv = document.createElement("div"); pageDiv.className = "print-page";
              const img = document.createElement("img"); img.src = dataUrl;
              pageDiv.appendChild(img); printArea.appendChild(pageDiv);
            }
            const imgs = Array.from(printArea.querySelectorAll("img"));
            await Promise.all(imgs.map((img) => { if (img.complete) return Promise.resolve(); return new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; }); }));
            window.print();
          } catch (err) { console.error(err); alert("Error al preparar la impresión."); }
          finally { btn.disabled = false; btn.textContent = "Imprimir"; }
        });

        applyInspectorPosition("bottom");
        document.body.classList.add("fullscreen-mode");
$("toggleViewModeBtn").textContent = "📋 Ver Controles";
        renderAll();
      });
    })();
  </script>
</body>
</html>
