      --grid-color: rgba(59,130,196,0.15);
      --scrollbar-thumb: var(--line);
      --scrollbar-thumb-hover: #b0b8c1;

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--header-bg);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-section .sec-title {
      display: none;
    }

    .toolbar-section .sec-body {
      display: flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      padding: 2px 4px;
      border-radius: 6px;
      border: none;
      height: 28px;
    }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--line);
      margin: 0 2px;
    }

    .divider-v {
      width: 1px;
      height: 16px;
      background: var(--line);
      margin: 0 3px;
    }

    .small-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 6px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 4px;
      outline: none;
      height: 24px;
    }

    .check-btn {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--check-btn-color);
      user-select: none;
      margin: 0;
      white-space: nowrap;
    }

    .check-btn input {
      accent-color: var(--accent);
      margin: 0;
      cursor: pointer;
      width: 13px;
      height: 13px;
    }

    .quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--quick-bar-bg);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--quick-bar-border);
    }

    .quick-bar .group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quick-bar label {
      margin: 0;
      font-size: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .quick-bar span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .mobile-tabs {
      display: flex;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 70px;
      z-index: 35;
    }

    .mobile-tabs button {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .mobile-tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(59,130,196,0.06);
    }

    .app-container {
      display: flex;
      flex: 1;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 850px) {
      .mobile-tabs {
        display: none;
      }
      .app-container {
        flex-direction: row;
        overflow: hidden;
        height: calc(100vh - 72px);
      }
      main.sidebar {
        width: 300px;
        min-width: 300px;
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 12px;
        height: 100%;
        display: block !important;
        background: var(--panel);
      }
      #stage-wrapper {
        flex: 1;
        height: 100%;
        overflow: auto;
        margin-top: 0 !important;
        background: var(--stage-bg);
      }
    }

    body.fullscreen-mode main.sidebar {
      display: none !important;
    }

    body.fullscreen-mode .mobile-tabs {
      display: none !important;
    }

    body.fullscreen-mode #stage-wrapper {
      width: 100% !important;
      height: calc(100vh - 72px) !important;
    }

    main.sidebar {
      padding: 12px;
      max-width: 580px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .panel::before {
      content: attr(data-tag);
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--panel);
      padding: 0 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin: 8px 0 3px;
      font-weight: 500;
    }

    label:first-child {
      margin-top: 2px;
    }

    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      padding: 7px 9px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 11px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > div {
      flex: 1;
    }

    .toggle {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .toggle button {
      flex: 1;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--muted);
      padding: 7px 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: 0.15s;
    }

    .toggle button.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--toggle-active-bg);
      font-weight: 600;
    }

    .btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: 0.15s;
      white-space: nowrap;
    }

    .btn.cyan {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.small {
      padding: 2px 6px;
      font-size: 10px;
    }

    .btn.full {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      font-size: 11px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cta {
      width: 100%;
      background: var(--cta-bg);
      color: var(--cta-color);
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 8px rgba(59,130,196,0.2);
    }

    .cta.secondary {
      background: var(--cta-secondary-bg);
      color: var(--cta-secondary-color);
      border: 1px solid var(--cta-secondary-border);
      box-shadow: none;
    }

    #stage-wrapper {
      overflow: auto;
      padding: 20px;
      background: var(--stage-bg);
      border: none;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 450px;
    }

    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      transition: transform 0.15s ease-out;
    }

    .page {
      position: relative;
      background: #fff;
      box-shadow: var(--page-shadow);
      margin-bottom: 18px;
      touch-action: none;
      overflow: hidden;
    }

    .page.grid-bg {

      user-select: none;
      touch-action: none;
      overflow: visible;

      justify-content: center;

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);

      const PAPERS = {
        carta: [21.6, 27.9],
        oficio: [21.6, 34],
        legal: [21.6, 35.6],
      };

      let orientation = "vertical";
      let paperType = "carta";
      let customW = 21.6;
      let customH = 27.9;

      let pages = [{ id: 1, els: [] }];
      let currentPageIndex = 0;
      let selectedIds = new Set();
      let multiSelectMode = false;

      let elCounter = 1;
      let pageCounter = 1;

      let PX_PER_CM = 10;
      let zoomScale = 1.0;
      let batchDistrib = "auto";
      let batchMode = "fill";

      let undoStack = [];
      let redoStack = [];
      let isHistoryAction = false;
      let clipboard = [];

      const imgCache = new Map();
      function getLoadedImage(src) {
        return new Promise((resolve, reject) => {
          if (imgCache.has(src)) {
            const img = imgCache.get(src);
            if (img.complete && img.naturalWidth > 0) return resolve(img);
          }
          const img = new Image();
          img.onload = () => { imgCache.set(src, img); resolve(img); };
          img.onerror = reject;
          img.src = src;
        });
      }

      function sanitizeEl(el) {
        el.mode = el.mode || "fit";
        if (el.imgZoom === undefined || el.imgZoom === null) el.imgZoom = 100;
        if (el.imgPosX === undefined || el.imgPosX === null) el.imgPosX = 0;
        if (el.imgPosY === undefined || el.imgPosY === null) el.imgPosY = 0;
        if (el.imgRotate === undefined || el.imgRotate === null) el.imgRotate = 0;
        if (el.showOverflow === undefined || el.showOverflow === null) el.showOverflow = false;
        if (el.borderColor === undefined) el.borderColor = "#000000";
        if (el.borderWidth === undefined) el.borderWidth = "0";
      }

      function saveState() {
        if (isHistoryAction) return;
        const snapshot = JSON.stringify({ pages, currentPageIndex, orientation, paperType, customW, customH });
        if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapshot) return;
        undoStack.push(snapshot);
        if (undoStack.length > 30) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      }

      function undo() {
        if (undoStack.length <= 1) return;
        isHistoryAction = true;
        redoStack.push(undoStack.pop());
        const prev = JSON.parse(undoStack[undoStack.length - 1]);
        pages = prev.pages; currentPageIndex = Math.min(prev.currentPageIndex, pages.length - 1);
        orientation = prev.orientation; paperType = prev.paperType; customW = prev.customW; customH = prev.customH;
        selectedIds = new Set();
        syncUIWithState(); renderAll();
        isHistoryAction = false;
        updateHistoryButtons();
      }

      function redo() {
        if (redoStack.length === 0) return;
        isHistoryAction = true;
        const snapshotStr = redoStack.pop();
        undoStack.push(snapshotStr);
        const next = JSON.parse(snapshotStr);
        pages = next.pages; currentPageIndex = Math.min(next.currentPageIndex, pages.length - 1);
        orientation = next.orientation; paperType = next.paperType; customW = next.customW; customH = next.customH;
        selectedIds = new Set();
        syncUIWithState(); renderAll();
        isHistoryAction = false;
        updateHistoryButtons();
      }

      function updateHistoryButtons() {
        $("undoBtn").disabled = undoStack.length <= 1;
        $("redoBtn").disabled = redoStack.length === 0;
      }

      function syncUIWithState() {
        $("paperType").value = paperType;
        $("customPaperRow").style.display = paperType === "custom" ? "flex" : "none";
        $("orientV").classList.toggle("active", orientation === "vertical");
        $("orientH").classList.toggle("active", orientation === "horizontal");
      }

      function getPaperCm() {
        let w, h;
        if (paperType === "custom") { w = customW; h = customH; }
        else { [w, h] = PAPERS[paperType]; }
        if (orientation === "horizontal") [w, h] = [h, w];
        return { w, h };
      }

      function recomputeScale() {
        const paper = getPaperCm();
        const wrapper = $("stage-wrapper");
        const availableWidth = wrapper ? wrapper.clientWidth - 40 : 480;
        const maxW = Math.max(260, Math.min(availableWidth, 520));
        PX_PER_CM = maxW / paper.w;
      }

      function findEl(id) { for (const p of pages) for (const e of p.els) if (e.id === id) return e; return null; }
      function currentPage() { return pages[currentPageIndex]; }
      function snap(val) { if (!$("snapGrid").checked) return val; const step = parseFloat($("snapStep").value) || 0.5; return Math.round(val / step) * step; }
      function isSelected(id) { return selectedIds.has(id); }
      function getSelectedEls() { return [...selectedIds].map(findEl).filter(Boolean); }
      function getSingleSelected() { return selectedIds.size === 1 ? findEl([...selectedIds][0]) : null; }
      function selectSingle(id) { selectedIds = new Set([id]); renderAll(); }
      function toggleSelect(id) { const next = new Set(selectedIds); next.has(id) ? next.delete(id) : next.add(id); selectedIds = next; renderAll(); }
      function deselectAll() { selectedIds = new Set(); $("inspector").classList.remove("show"); renderAll(); }

      function centerElementsGroup(elements, paperDims, axis) {
        if (!elements || elements.length === 0) return;
        const minX = Math.min(...elements.map((e) => e.xCm));
        const maxX = Math.max(...elements.map((e) => e.xCm + e.wCm));
        const minY = Math.min(...elements.map((e) => e.yCm));
        const maxY = Math.max(...elements.map((e) => e.yCm + e.hCm));
        const groupW = maxX - minX, groupH = maxY - minY;
        let dx = 0, dy = 0;
        if (axis === "h" || axis === "both") dx = (paperDims.w - groupW) / 2 - minX;
        if (axis === "v" || axis === "both") dy = (paperDims.h - groupH) / 2 - minY;
        elements.forEach((e) => { e.xCm = snap(e.xCm + dx); e.yCm = snap(e.yCm + dy); });
      }

      async function renderPageToCanvas(pageIndex, targetDpi = 300) {
        const paper = getPaperCm();
        const pxPerCm = targetDpi / 2.54;
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(paper.w * pxPerCm);
        canvas.height = Math.floor(paper.h * pxPerCm);
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const p = pages[pageIndex];
        if (!p) return canvas;
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        for (const el of p.els) {
          sanitizeEl(el);
          try {
            const img = await getLoadedImage(el.src);
            const xPx = el.xCm * pxPerCm, yPx = el.yCm * pxPerCm, wPx = el.wCm * pxPerCm, hPx = el.hCm * pxPerCm;
            if (wPx <= 0 || hPx <= 0) continue;
            ctx.save(); ctx.beginPath(); ctx.rect(xPx, yPx, wPx, hPx); ctx.clip();
            const zoom = (Number(el.imgZoom) || 100) / 100;
            const posX = Number(el.imgPosX) || 0, posY = Number(el.imgPosY) || 0;
            const rot = (Number(el.imgRotate) || 0) * (Math.PI / 180);
            const mode = el.mode || "fit";
            const imgAspect = img.width / img.height;
            const frameAspect = wPx / hPx;
            let drawW, drawH;
            if (mode === "fill") {
              if (imgAspect > frameAspect) { drawH = hPx; drawW = drawH * imgAspect; }
              else { drawW = wPx; drawH = drawW / imgAspect; }
              if (zoom < 1.0) { if (imgAspect > frameAspect) { drawW = wPx; drawH = drawW / imgAspect; } else { drawH = hPx; drawW = drawH * imgAspect; } }
              const objPosX = 50 + posX / 2, objPosY = 50 + posY / 2;
              const anchorImgX = (drawW * objPosX) / 100, anchorImgY = (drawH * objPosY) / 100;
              const anchorContainerX = (wPx * objPosX) / 100, anchorContainerY = (hPx * objPosY) / 100;
              let imgLeft = xPx + anchorContainerX - anchorImgX, imgTop = yPx + anchorContainerY - anchorImgY;
              const centerX = xPx + wPx / 2, centerY = yPx + hPx / 2;
              const imgCenterX = imgLeft + drawW / 2, imgCenterY = imgTop + drawH / 2;
              const newCenterX = centerX + (imgCenterX - centerX) * zoom, newCenterY = centerY + (imgCenterY - centerY) * zoom;
              const newW = drawW * zoom, newH = drawH * zoom;
              imgLeft = newCenterX - newW / 2; imgTop = newCenterY - newH / 2;
              ctx.translate(centerX, centerY); ctx.rotate(rot); ctx.translate(-centerX, -centerY);
              ctx.drawImage(img, imgLeft, imgTop, newW, newH);
            } else {
              if (imgAspect > frameAspect) { drawW = wPx; drawH = drawW / imgAspect; }
              else { drawH = hPx; drawW = drawH * imgAspect; }
              const overflowX = wPx - drawW, overflowY = hPx - drawH;
              const offsetX = (overflowX / 2) * (posX / 100), offsetY = (overflowY / 2) * (posY / 100);
              const centerX = xPx + wPx / 2, centerY = yPx + hPx / 2;
              let imgCenterX = centerX + offsetX, imgCenterY = centerY + offsetY;
              const newW = drawW * zoom, newH = drawH * zoom;
              const newCenterX = centerX + (imgCenterX - centerX) * zoom, newCenterY = centerY + (imgCenterY - centerY) * zoom;
              const imgLeft = newCenterX - newW / 2, imgTop = newCenterY - newH / 2;
              ctx.translate(centerX, centerY); ctx.rotate(rot); ctx.translate(-centerX, -centerY);
              ctx.drawImage(img, imgLeft, imgTop, newW, newH);
            }
            ctx.restore();
            if (el.borderWidth && parseFloat(el.borderWidth) > 0) {
              const borderPx = (parseFloat(el.borderWidth) / 10) * pxPerCm;
              ctx.save(); ctx.strokeStyle = el.borderColor || "#000000"; ctx.lineWidth = borderPx;
              const half = borderPx / 2; ctx.strokeRect(xPx + half, yPx + half, wPx - borderPx, hPx - borderPx);
              ctx.restore();
            }
          } catch (err) { console.error("Error renderizando imagen:", err); }
        }
        return canvas;
      }

      function setZoom(val) { zoomScale = Math.max(0.2, Math.min(2.0, val)); $("quickZoomVal").textContent = Math.round(zoomScale * 100) + "%"; renderAll(); }

      function renderAll() {
        recomputeScale();
        const paper = getPaperCm();
        const stage = $("stage"); stage.innerHTML = "";
        const p = currentPage();
        stage.style.transform = `scale(${zoomScale})`;
        const pageDiv = document.createElement("div");
        pageDiv.className = "page" + ($("showGrid").checked ? " grid-bg" : "");
        pageDiv.style.width = paper.w * PX_PER_CM + "px";
        pageDiv.style.height = paper.h * PX_PER_CM + "px";
        const stepCm = parseFloat($("snapStep").value) || 0.5;
        if ($("showGrid").checked) pageDiv.style.backgroundSize = `${stepCm * PX_PER_CM}px ${stepCm * PX_PER_CM}px`;
        pageDiv.addEventListener("pointerdown", (e) => { if (e.target === pageDiv) deselectAll(); });
        p.els.forEach((el) => {
          sanitizeEl(el);
          const d = document.createElement("div");
          d.className = "el" + (isSelected(el.id) ? " selected" : "") + (el.showOverflow ? " show-overflow" : "");
          d.dataset.id = el.id;
          d.style.left = el.xCm * PX_PER_CM + "px"; d.style.top = el.yCm * PX_PER_CM + "px";
          d.style.width = el.wCm * PX_PER_CM + "px"; d.style.height = el.hCm * PX_PER_CM + "px";
          const contentDiv = document.createElement("div"); contentDiv.className = "el-content";
          if (el.borderWidth && parseFloat(el.borderWidth) > 0) {
            const borderPx = (parseFloat(el.borderWidth) / 10) * PX_PER_CM;
            d.style.border = `${Math.max(1, borderPx)}px solid ${el.borderColor || "#000000"}`;
          } else d.style.border = "none";
          const img = document.createElement("img"); img.src = el.src;
          img.style.objectFit = el.mode === "fill" ? "cover" : "contain";
          const zoom = (el.imgZoom !== undefined ? el.imgZoom : 100) / 100;
          const posX = el.imgPosX || 0, posY = el.imgPosY || 0, rot = el.imgRotate || 0;
          if (el.mode === "fill") {
            img.style.objectPosition = `${50 + posX / 2}% ${50 + posY / 2}%`;
            img.style.transform = `scale(${zoom}) rotate(${rot}deg)`;
            if (zoom < 1.0) img.style.objectFit = "contain";
          } else { img.style.transform = `translate(${posX}%, ${posY}%) scale(${zoom}) rotate(${rot}deg)`; }
          contentDiv.appendChild(img); d.appendChild(contentDiv);
          if (selectedIds.size <= 1) { const handle = document.createElement("div"); handle.className = "handle"; d.appendChild(handle); attachResize(handle, d, el); }
          attachDrag(d, el);
          d.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); if (multiSelectMode) toggleSelect(el.id); else if (!isSelected(el.id)) selectSingle(el.id); });
          pageDiv.appendChild(d);
        });
        stage.appendChild(pageDiv);
        $("quickPageLabel").textContent = `${currentPageIndex + 1}/${pages.length}`;
        $("prevPageQuickBtn").disabled = currentPageIndex === 0;
        $("nextPageQuickBtn").disabled = currentPageIndex === pages.length - 1;
        syncInspector();
      }

      function attachDrag(d, el) {
        let dragging = false, sx = 0, sy = 0, startPositions = new Map();
        d.addEventListener("pointerdown", (e) => { if (e.target.classList.contains("handle")) return; dragging = true; d.classList.add("dragging"); sx = e.clientX; sy = e.clientY; const group = isSelected(el.id) && selectedIds.size > 1 ? getSelectedEls() : [el]; startPositions = new Map(group.map((e2) => [e2.id, { xCm: e2.xCm, yCm: e2.yCm }])); d.setPointerCapture(e.pointerId); });
        d.addEventListener("pointermove", (e) => { if (!dragging) return; const dxCm = (e.clientX - sx) / (PX_PER_CM * zoomScale); const dyCm = (e.clientY - sy) / (PX_PER_CM * zoomScale); startPositions.forEach((pos, id) => { const e2 = findEl(id); if (!e2) return; e2.xCm = snap(pos.xCm + dxCm); e2.yCm = snap(pos.yCm + dyCm); const domEl = document.querySelector(`.el[data-id="${id}"]`); if (domEl) { domEl.style.left = e2.xCm * PX_PER_CM + "px"; domEl.style.top = e2.yCm * PX_PER_CM + "px"; } }); syncInspectorInputsOnly(); });
        const end = () => { if (dragging) { dragging = false; d.classList.remove("dragging"); saveState(); syncInspector(); } };
        d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
      }

      function attachResize(handle, d, el) {
        let resizing = false, sx = 0, sy = 0, swCm = 0, shCm = 0;
        handle.addEventListener("pointerdown", (e) => { e.stopPropagation(); resizing = true; sx = e.clientX; sy = e.clientY; swCm = el.wCm; shCm = el.hCm; handle.setPointerCapture(e.pointerId); });
        handle.addEventListener("pointermove", (e) => { if (!resizing) return; const dwCm = (e.clientX - sx) / (PX_PER_CM * zoomScale); const dhCm = (e.clientY - sy) / (PX_PER_CM * zoomScale); el.wCm = Math.max(0.5, snap(swCm + dwCm)); el.hCm = Math.max(0.5, snap(shCm + dhCm)); d.style.width = el.wCm * PX_PER_CM + "px"; d.style.height = el.hCm * PX_PER_CM + "px"; syncInspectorInputsOnly(); });
        const end = () => { if (resizing) { resizing = false; saveState(); } };
        handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
      }

      function syncInspectorInputsOnly() { if (selectedIds.size !== 1) return; const el = getSingleSelected(); if (!el) return; $("elW").value = el.wCm.toFixed(1); $("elH").value = el.hCm.toFixed(1); }

      function syncInspector() {
        const count = selectedIds.size;
        if (count === 0) { $("inspector").classList.remove("show"); return; }
        $("inspector").classList.add("show"); $("centerModeSelect").value = "none";
        if (count > 1) { $("multiInspectorControls").style.display = "block"; $("singleInspectorControls").style.display = "none"; $("multiCountLabel").textContent = `${count} imágenes seleccionadas`; return; }
        $("multiInspectorControls").style.display = "none"; $("singleInspectorControls").style.display = "block";
        const el = getSingleSelected(); if (!el) { $("inspector").classList.remove("show"); return; }
        $("elW").value = el.wCm.toFixed(1); $("elH").value = el.hCm.toFixed(1);
        $("modeFit").classList.toggle("active", el.mode === "fit"); $("modeFill").classList.toggle("active", el.mode === "fill");
        $("borderColor").value = el.borderColor || "#000000"; $("borderWidth").value = el.borderWidth || "0";
        $("imgZoom").value = el.imgZoom !== undefined ? el.imgZoom : 100; $("imgZoomVal").textContent = (el.imgZoom !== undefined ? el.imgZoom : 100) + "%";
        $("imgPosX").value = el.imgPosX || 0; $("imgPosXVal").textContent = (el.imgPosX || 0) + "%";
        $("imgPosY").value = el.imgPosY || 0; $("imgPosYVal").textContent = (el.imgPosY || 0) + "%";
        $("imgRotate").value = el.imgRotate || 0; $("showOverflowCheck").checked = !!el.showOverflow;
      }

      // Lógica de temas
      function applyTheme(themeName) {
        document.body.className = document.body.className.replace(/theme-\w+/g, '');
        document.body.classList.add(`theme-${themeName}`);
        localStorage.setItem('image-editor-theme', themeName);
      }

      function loadTheme() {
        const saved = localStorage.getItem('image-editor-theme') || 'light';
        applyTheme(saved);
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadTheme();
        const themeBtn = $('themeToggleBtn');
        const themeModal = $('themeModal');
        const themeBackdrop = $('themeBackdrop');
        themeBtn.addEventListener('click', () => { themeModal.classList.toggle('show'); themeBackdrop.classList.toggle('show'); });
        themeBackdrop.addEventListener('click', () => { themeModal.classList.remove('show'); themeBackdrop.classList.remove('show'); });
        document.querySelectorAll('.theme-option').forEach(btn => {
          btn.addEventListener('click', (e) => { const theme = e.target.dataset.theme; applyTheme(theme); themeModal.classList.remove('show'); themeBackdrop.classList.remove('show'); });
        });
      });

      window.addEventListener("load", () => {
        saveState();
        window.addEventListener("resize", renderAll);
        $("multiSelectBtn").addEventListener("click", () => { multiSelectMode = !multiSelectMode; $("multiSelectBtn").classList.toggle("cyan", multiSelectMode); $("multiSelectBtn").textContent = multiSelectMode ? "☰ Multi: ON" : "☰ Multi"; document.body.classList.toggle("multiselect-mode", multiSelectMode); renderAll(); });
        $("zoomInQuickBtn").addEventListener("click", () => setZoom(zoomScale + 0.15));
        $("zoomOutQuickBtn").addEventListener("click", () => setZoom(zoomScale - 0.15));
        $("zoomResetQuickBtn").addEventListener("click", () => setZoom(1.0));
        $("copyBtn").addEventListener("click", () => { const els = getSelectedEls(); if (els.length > 0) clipboard = els.map((el) => JSON.parse(JSON.stringify(el))); });
        $("cutBtn").addEventListener("click", () => { const els = getSelectedEls(); if (els.length > 0) { clipboard = els.map((el) => JSON.parse(JSON.stringify(el))); const p = currentPage(); p.els = p.els.filter((e) => !selectedIds.has(e.id)); saveState(); deselectAll(); } });

        $("prevPageQuickBtn").addEventListener("click", () => { if (currentPageIndex > 0) { currentPageIndex--; deselectAll(); } });
        $("nextPageQuickBtn").addEventListener("click", () => { if (currentPageIndex < pages.length - 1) { currentPageIndex++; deselectAll(); } });

        document.querySelectorAll(".mobile-tabs button").forEach((btn) => { btn.addEventListener("click", () => { document.querySelectorAll(".mobile-tabs button").forEach((b) => b.classList.remove("active")); btn.classList.add("active"); document.body.classList.remove("fullscreen-mode"); $("toggleViewModeBtn").textContent = "🖼️ Solo Hoja"; renderAll(); }); });
        $("undoBtn").addEventListener("click", undo); $("redoBtn").addEventListener("click", redo);
        $("paperType").addEventListener("change", (e) => { paperType = e.target.value; $("customPaperRow").style.display = paperType === "custom" ? "flex" : "none"; saveState(); renderAll(); });
        $("paperW").addEventListener("change", (e) => { customW = parseFloat(e.target.value) || customW || 21.6; saveState(); renderAll(); });
        $("paperH").addEventListener("change", (e) => { customH = parseFloat(e.target.value) || customH || 27.9; saveState(); renderAll(); });
        $("orientV").addEventListener("click", () => { orientation = "vertical"; $("orientV").classList.add("active"); $("orientH").classList.remove("active"); saveState(); renderAll(); });
        $("orientH").addEventListener("click", () => { orientation = "horizontal"; $("orientH").classList.add("active"); $("orientV").classList.remove("active"); saveState(); renderAll(); });
        $("showGrid").addEventListener("change", renderAll); $("snapGrid").addEventListener("change", renderAll); $("snapStep").addEventListener("change", renderAll);
        $("openBatchBtn").addEventListener("click", () => $("batchModal").classList.add("show"));
        $("closeBatch").addEventListener("click", () => $("batchModal").classList.remove("show"));
        $("distribAuto").addEventListener("click", () => { batchDistrib = "auto"; $("distribAuto").classList.add("active"); $("distribManual").classList.remove("active"); $("autoSection").style.display = "block"; $("manualSection").style.display = "none"; });
        $("distribManual").addEventListener("click", () => { batchDistrib = "manual"; $("distribManual").classList.add("active"); $("distribAuto").classList.remove("active"); $("autoSection").style.display = "none"; $("manualSection").style.display = "flex"; });
        $("batchModeFit").addEventListener("click", () => { batchMode = "fit"; $("batchModeFit").classList.add("active"); $("batchModeFill").classList.remove("active"); });
        $("batchModeFill").addEventListener("click", () => { batchMode = "fill"; $("batchModeFill").classList.add("active"); $("batchModeFit").classList.remove("active"); });
        $("runBatchBtn").addEventListener("click", () => {
          const filesInput = $("batchFiles");
          if (!filesInput.files || filesInput.files.length === 0) { alert("Por favor selecciona al menos una imagen."); return; }
          const files = Array.from(filesInput.files);
          const paper = getPaperCm();
          const margin = parseFloat($("batchMargin").value) || 1.0;
          const gap = parseFloat($("batchGap").value) || 0.5;
          const centerMode = $("batchCenterMode").value;
          let cols = 1, rows = 1;
          if (batchDistrib === "auto") { const ipp = parseInt($("imgPerPage").value); if (ipp === 1) { cols = 1; rows = 1; } else if (ipp === 2) { cols = 1; rows = 2; } else if (ipp === 3) { cols = 1; rows = 3; } else { cols = 2; rows = 2; } }
          let cellW = 0, cellH = 0;
          if (batchDistrib === "auto") { cellW = (paper.w - margin * 2 - gap * (cols - 1)) / cols; cellH = (paper.h - margin * 2 - gap * (rows - 1)) / rows; }
          else { cellW = parseFloat($("batchW").value) || 8; cellH = parseFloat($("batchH").value) || 8; cols = Math.max(1, Math.floor((paper.w - margin * 2 + gap) / (cellW + gap))); rows = Math.max(1, Math.floor((paper.h - margin * 2 + gap) / (cellH + gap))); }
          const perPage = cols * rows;
          let loadedCount = 0;
          const addedByPage = {};
          files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const pageIdx = Math.floor(index / perPage);
              const posInPage = index % perPage;
              while (pages.length <= pageIdx) pages.push({ id: ++pageCounter, els: [] });
              const col = posInPage % cols, row = Math.floor(posInPage / cols);
              const xCm = margin + col * (cellW + gap), yCm = margin + row * (cellH + gap);
              const newEl = { id: ++elCounter, src: ev.target.result, xCm: snap(xCm), yCm: snap(yCm), wCm: snap(cellW), hCm: snap(cellH), mode: batchMode, imgZoom: 100, imgPosX: 0, imgPosY: 0, imgRotate: 0, showOverflow: false };
              pages[pageIdx].els.push(newEl);
              if (!addedByPage[pageIdx]) addedByPage[pageIdx] = [];
              addedByPage[pageIdx].push(newEl);
              loadedCount++;
              if (loadedCount === files.length) {
                if (centerMode !== "none") Object.keys(addedByPage).forEach((pIdx) => centerElementsGroup(addedByPage[pIdx], paper, centerMode));
                $("batchModal").classList.remove("show");
                saveState();
                renderAll();
              }
            };
            reader.readAsDataURL(file);
          });
        });
        $("imgZoom").addEventListener("input", (e) => { const el = getSingleSelected(); if (el) { el.imgZoom = parseInt(e.target.value); $("imgZoomVal").textContent = el.imgZoom + "%"; renderAll(); } });

        $("imgPosX").addEventListener("input", (e) => { const el = getSingleSelected(); if (el) { el.imgPosX = parseInt(e.target.value); $("imgPosXVal").textContent = el.imgPosX + "%"; renderAll(); } });
        $("imgPosX").addEventListener("change", saveState);
        $("imgPosY").addEventListener("input", (e) => { const el = getSingleSelected(); if (el) { el.imgPosY = parseInt(e.target.value); $("imgPosYVal").textContent = el.imgPosY + "%"; renderAll(); } });
        $("imgPosY").addEventListener("change", saveState);
        $("imgRotate").addEventListener("change", (e) => { const el = getSingleSelected(); if (el) { el.imgRotate = parseInt(e.target.value); saveState(); renderAll(); } });
        $("showOverflowCheck").addEventListener("change", (e) => { const el = getSingleSelected(); if (el) { el.showOverflow = e.target.checked; saveState(); renderAll(); } });
        $("resetImgAdjust").addEventListener("click", () => { const el = getSingleSelected(); if (el) { el.imgZoom = 100; el.imgPosX = 0; el.imgPosY = 0; el.imgRotate = 0; el.showOverflow = false; saveState(); syncInspector(); renderAll(); } });
        $("elW").addEventListener("input", (e) => { const el = getSingleSelected(); if (!el) return; const val = parseFloat(e.target.value); if (!isNaN(val) && val > 0) { el.wCm = val; const domEl = document.querySelector(`.el[data-id="${el.id}"]`); if (domEl) domEl.style.width = el.wCm * PX_PER_CM + "px"; } });
        $("elW").addEventListener("change", (e) => { const el = getSingleSelected(); if (el) { el.wCm = Math.max(0.5, parseFloat(e.target.value) || el.wCm || 1); } saveState(); renderAll(); });
        $("elH").addEventListener("input", (e) => { const el = getSingleSelected(); if (!el) return; const val = parseFloat(e.target.value); if (!isNaN(val) && val > 0) { el.hCm = val; const domEl = document.querySelector(`.el[data-id="${el.id}"]`); if (domEl) domEl.style.height = el.hCm * PX_PER_CM + "px"; } });
        $("elH").addEventListener("change", (e) => { const el = getSingleSelected(); if (el) { el.hCm = Math.max(0.5, parseFloat(e.target.value) || el.hCm || 1); } saveState(); renderAll(); });
        $("modeFit").addEventListener("click", () => { const el = getSingleSelected(); if (el) { el.mode = "fit"; saveState(); syncInspector(); renderAll(); } });
        $("modeFill").addEventListener("click", () => { const el = getSingleSelected(); if (el) { el.mode = "fill"; saveState(); syncInspector(); renderAll(); } });
        $("borderColor").addEventListener("input", (e) => { const el = getSingleSelected(); if (el) { el.borderColor = e.target.value; renderAll(); } });
        $("borderColor").addEventListener("change", saveState);
        $("borderWidth").addEventListener("change", (e) => { const el = getSingleSelected(); if (el) { el.borderWidth = e.target.value; saveState(); renderAll(); } });
        $("duplicateEl").addEventListener("click", () => { const el = getSingleSelected(); if (el) { const newEl = JSON.parse(JSON.stringify(el)); newEl.id = ++elCounter; newEl.xCm += 0.5; newEl.yCm += 0.5; currentPage().els.push(newEl); saveState(); selectSingle(newEl.id); } });
        $("deleteEl").addEventListener("click", () => { const p = currentPage(); p.els = p.els.filter((e) => !selectedIds.has(e.id)); saveState(); deselectAll(); });
        $("applyCenterBtn").addEventListener("click", () => { const mode = $("centerModeSelect").value; if (mode === "none") return; const els = getSelectedEls(); if (els.length === 0) return; centerElementsGroup(els, getPaperCm(), mode); saveState(); renderAll(); });
        $("borderColorMulti").addEventListener("input", (e) => { getSelectedEls().forEach((el) => (el.borderColor = e.target.value)); renderAll(); });
        $("borderColorMulti").addEventListener("change", saveState);
        $("borderWidthMulti").addEventListener("change", (e) => { getSelectedEls().forEach((el) => (el.borderWidth = e.target.value)); saveState(); renderAll(); });
        $("modeFitMulti").addEventListener("click", () => { getSelectedEls().forEach((el) => (el.mode = "fit")); $("modeFitMulti").classList.add("active"); $("modeFillMulti").classList.remove("active"); saveState(); renderAll(); });
        $("modeFillMulti").addEventListener("click", () => { getSelectedEls().forEach((el) => (el.mode = "fill")); $("modeFillMulti").classList.add("active"); $("modeFitMulti").classList.remove("active"); saveState(); renderAll(); });
        $("duplicateMulti").addEventListener("click", () => { const els = getSelectedEls(); const newIds = []; els.forEach((el) => { const newEl = JSON.parse(JSON.stringify(el)); newEl.id = ++elCounter; newEl.xCm += 0.5; newEl.yCm += 0.5; currentPage().els.push(newEl); newIds.push(newEl.id); }); selectedIds = new Set(newIds); saveState(); renderAll(); });
        $("deleteMulti").addEventListener("click", () => { const p = currentPage(); p.els = p.els.filter((e) => !selectedIds.has(e.id)); saveState(); deselectAll(); });
        $("closeInspector").addEventListener("click", deselectAll);
        const inspectorEl = $("inspector"); const posButtons = { bottom: $("posBottomBtn") }; const inspectorSizes = { bottom: "250px" }; let inspectorPos = "bottom";
        function applyInspectorPosition(pos) { inspectorPos = pos; inspectorEl.classList.remove("pos-bottom"); inspectorEl.classList.add("pos-" + pos); inspectorEl.style.height = inspectorSizes["bottom"]; inspectorEl.style.width = ""; if (posButtons.bottom) posButtons.bottom.classList.add("active"); }
        const dragbar = $("inspectorDragbar"); let resizingInspector = false, startClientX = 0, startClientY = 0, startSize = 0;
        dragbar.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; resizingInspector = true; startClientX = e.clientX; startClientY = e.clientY; const rect = inspectorEl.getBoundingClientRect(); startSize = rect.height; dragbar.setPointerCapture(e.pointerId); });
        dragbar.addEventListener("pointermove", (e) => { if (!resizingInspector) return; let newSize = startSize - (e.clientY - startClientY); newSize = Math.max(120, Math.min(window.innerHeight * 0.85, newSize)); inspectorEl.style.height = newSize + "px"; inspectorSizes["bottom"] = newSize + "px"; });
        dragbar.addEventListener("pointerup", () => (resizingInspector = false)); dragbar.addEventListener("pointercancel", () => (resizingInspector = false));
        $("addFiles").addEventListener("change", (e) => { const files = Array.from(e.target.files); let count = 0; files.forEach((file) => { const reader = new FileReader(); reader.onload = (ev) => { currentPage().els.push({ id: ++elCounter, src: ev.target.result, xCm: 1.0, yCm: 1.0, wCm: 8.0, hCm: 8.0, mode: "fit", imgZoom: 100, imgPosX: 0, imgPosY: 0, imgRotate: 0, showOverflow: false }); count++; if (count === files.length) { saveState(); renderAll(); } }; reader.readAsDataURL(file); }); });
        $("addPageBtn").addEventListener("click", () => { pages.push({ id: ++pageCounter, els: [] }); currentPageIndex = pages.length - 1; saveState(); deselectAll(); });
        $("delPageBtn").addEventListener("click", () => { if (pages.length > 1) { pages.splice(currentPageIndex, 1); if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1; saveState(); deselectAll(); } });

        // ✅ FUNCIONES PDF E IMPRESIÓN RESTAURADAS
        $("pdfBtn").addEventListener("click", async () => {
          saveState();
          const btn = $("pdfBtn"); btn.disabled = true; btn.textContent = "Generando PDF…";
          try {
            const { jsPDF } = window.jspdf;
            const paper = getPaperCm();
            const pdf = new jsPDF({ unit: "cm", format: [paper.w, paper.h], orientation: "portrait", compress: true });
            for (let i = 0; i < pages.length; i++) {
              const canvas = await renderPageToCanvas(i, 300);
              const imgData = canvas.toDataURL("image/jpeg", 0.95);
              if (i > 0) pdf.addPage([paper.w, paper.h], "portrait");
              pdf.addImage(imgData, "JPEG", 0, 0, paper.w, paper.h, undefined, "FAST");
            }
            pdf.save("Documento_Impresion.pdf");
          } catch (err) { console.error(err); alert("Ocurrió un error al generar el PDF."); }
          finally { btn.disabled = false; btn.textContent = "Generar PDF"; }
        });

        $("printBtn").addEventListener("click", async () => {
          saveState();
          const btn = $("printBtn"); btn.disabled = true; btn.textContent = "Preparando…";
          try {
            const paper = getPaperCm();
            const printArea = $("printArea");
            printArea.innerHTML = "";
            let styleTag = document.getElementById("dynamicPageSize");
            if (!styleTag) { styleTag = document.createElement("style"); styleTag.id = "dynamicPageSize"; document.head.appendChild(styleTag); }
            styleTag.textContent = `@media print { @page { size: ${paper.w}cm ${paper.h}cm; margin: 0; } }`;
            for (let i = 0; i < pages.length; i++) {
              const canvas = await renderPageToCanvas(i, 300);
              const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
              const pageDiv = document.createElement("div"); pageDiv.className = "print-page";
              const img = document.createElement("img"); img.src = dataUrl;
              pageDiv.appendChild(img); printArea.appendChild(pageDiv);
            }
            const imgs = Array.from(printArea.querySelectorAll("img"));
            await Promise.all(imgs.map((img) => { if (img.complete) return Promise.resolve(); return new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; }); }));
            window.print();
          } catch (err) { console.error(err); alert("Error al preparar la impresión."); }
          finally { btn.disabled = false; btn.textContent = "Imprimir"; }
        });

        applyInspectorPosition("bottom");
        renderAll();
      });
    })();
  </script>
</body>
</html>
